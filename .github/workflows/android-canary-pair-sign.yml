name: Android updater UI fixed signed pair
on:
  push:
    branches: [codex/android-app-restoration-20260904]
    paths:
      - .github/workflows/android-canary-pair-sign.yml
      - scripts/sign_android_canary_candidate_ci.sh
  workflow_dispatch:
permissions:
  contents: write # Needed to read draft signing inputs.
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - build: '1005662'
            sha: 76bdd9ac2abc50505e4b0789d3a7ac87ffcebca530c119f9a524d8207d97824b
          - build: '1005663'
            sha: 7136d0e0836566cb6e681658dae2ec4f385c7986ac6ef10ea72f0f68f5e84314
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sign exact canary input with original app certificate
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          VEX_UPLOAD_STORE_PASSWORD: ${{ secrets.VEX_UPLOAD_STORE_PASSWORD }}
          VEX_UPLOAD_KEY_ALIAS: ${{ secrets.VEX_UPLOAD_KEY_ALIAS }}
          VEX_UPLOAD_KEY_PASSWORD: ${{ secrets.VEX_UPLOAD_KEY_PASSWORD }}
          INPUT_SHA: ${{ matrix.sha }}
          INPUT_BUILD: ${{ matrix.build }}
        run: bash scripts/sign_android_canary_candidate_ci.sh "$INPUT_SHA" "internal-ui-fix-20260904-$INPUT_BUILD" "$INPUT_BUILD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-canary-${{ matrix.build }}
          path: signed-candidate/
          if-no-files-found: error
          retention-days: 14
