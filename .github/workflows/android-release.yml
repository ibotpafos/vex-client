name: Android signed release

on:
  workflow_dispatch:
    inputs:
      release_abis:
        description: Android ABIs to include
        required: true
        default: arm64-v8a,armeabi-v7a

permissions:
  contents: read

concurrency:
  group: android-signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_RELEASE_VARIANT: release
      ANDROID_RELEASE_ABIS: ${{ inputs.release_abis }}
      ANDROID_GRADLE_ARGS: -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
      AMNEZIAWG_CLEAN: "0"
      VEX_UPLOAD_STORE_FILE: release.keystore
      VEX_UPLOAD_STORE_PASSWORD: ${{ secrets.VEX_UPLOAD_STORE_PASSWORD }}
      VEX_UPLOAD_KEY_ALIAS: ${{ secrets.VEX_UPLOAD_KEY_ALIAS }}
      VEX_UPLOAD_KEY_PASSWORD: ${{ secrets.VEX_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore Android SDK cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
            ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-${{ runner.os }}-api36-bt36-ndk270-ndk271-cmake3221

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Restore AmneziaWG caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/golang
            external/amnezia
          key: android-amnezia-${{ runner.os }}-${{ hashFiles('patches/amnezia/*.patch', 'scripts/bootstrap_amneziawg_android.sh') }}

      - name: Restore Android release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 VEX_UPLOAD_STORE_PASSWORD VEX_UPLOAD_KEY_ALIAS VEX_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "missing required secret: ${name}" >&2
              exit 2
            fi
          done
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > android/app/release.keystore

      - name: Verify client
        run: npm run check

      - name: Build signed Android APK
        run: npm run android:release

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vex-android-release-${{ github.sha }}
          path: dist/android/*
          if-no-files-found: error
          retention-days: 7
