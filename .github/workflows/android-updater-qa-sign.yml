name: Android updater QA signed instrumentation
on:
  push:
    branches: [codex/android-app-restoration-20260904]
    paths:
      - .github/workflows/android-updater-qa-sign.yml
      - scripts/sign_android_updater_qa_ci.sh
  workflow_dispatch:
permissions:
  contents: write # GitHub requires write access to read draft release assets.
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify legacy private key and sign fixed input
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          VEX_UPLOAD_STORE_PASSWORD: ${{ secrets.VEX_UPLOAD_STORE_PASSWORD }}
          VEX_UPLOAD_KEY_ALIAS: ${{ secrets.VEX_UPLOAD_KEY_ALIAS }}
          VEX_UPLOAD_KEY_PASSWORD: ${{ secrets.VEX_UPLOAD_KEY_PASSWORD }}
        run: bash scripts/sign_android_updater_qa_ci.sh 3aa073e2050df6d357f93254ae64f5e5d54a5bfc2e079fdfbafb53c721e75dc8 internal-updater-qa-20260904-v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-updater-qa
          path: signed-candidate/
          if-no-files-found: error
          retention-days: 14
