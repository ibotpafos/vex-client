name: Client signed tag release
on:
  push:
    tags:
      - android-v*
      - macos-v*
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options:
          - android
          - macos
        default: android
        required: true
      tag:
        type: string
        description: Versioned tag; empty means the committed version for dry-run
        default: ""
      dry_run:
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: client-stable-release
  cancel-in-progress: false
jobs:
  prepare:
    name: Validate immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      platform: ${{ steps.plan.outputs.platform }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - &a1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan exact release
        id: plan
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_PLATFORM: ${{ inputs.platform || 'android' }}
          AUTOPUBLISH_ENABLED: ${{ vars.VEX_CLIENT_AUTOPUBLISH_ENABLED }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |-
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(python3 -c 'import json,os; v=json.load(open("versions.json")); p=os.environ["RELEASE_PLATFORM"]; print(p+"-v"+v["android" if p=="android" else "native_macos"]["version"])')"
          fi
          # TODO release activation: enable only after signed receiver/site acceptance.
          if [[ "$RELEASE_DRY_RUN" != true && "$AUTOPUBLISH_ENABLED" != true ]]; then
            echo 'Receiver/site acceptance incomplete; publication disabled' >&2; exit 2
          fi
          python3 scripts/client_release.py plan --tag "$RELEASE_TAG" --dry-run "$RELEASE_DRY_RUN"
          if [[ "$RELEASE_DRY_RUN" != true && "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'Production release requires an exact version-tag event' >&2; exit 2
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 3
  quality:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *a1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - name: Release contract and negative fixtures
        run: python3 -m unittest discover -s tests -p "client_release_test.py" -v
      - name: Validate all release workflows
        run: node tests/client-release-workflow.mjs
  android:
    name: Build signed Android
    needs:
      - prepare
      - quality
    if: needs.prepare.outputs.platform == 'android' && needs.prepare.outputs.dry_run == 'false' && github.ref_type == 'tag'
    environment: client-release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      VEX_RELEASE_USE_LOCAL_CACHE: "1"
      VEX_LOCAL_RELEASE_CACHE_ROOT: ${{ github.workspace }}/.ci-cache
      VEX_LOCAL_CACHE_MOVE_EXISTING: "0"
      GRADLE_USER_HOME: ${{ github.workspace }}/.ci-cache/gradle
      GOCACHE: ${{ github.workspace }}/.ci-cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.ci-cache/go-mod
      ANDROID_RELEASE_ABIS: arm64-v8a,armeabi-v7a
    steps:
      - *a1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-plan
          path: .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.25.x
          cache: false
      - run: npm ci
      - name: Install locked Android SDK
        run: |-
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Build, verify signer and native unit suites
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          VEX_UPLOAD_STORE_PASSWORD: ${{ secrets.VEX_UPLOAD_STORE_PASSWORD }}
          VEX_UPLOAD_KEY_ALIAS: ${{ secrets.VEX_UPLOAD_KEY_ALIAS }}
          VEX_UPLOAD_KEY_PASSWORD: ${{ secrets.VEX_UPLOAD_KEY_PASSWORD }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
        run: |-
          set -euo pipefail
          set +x
          umask 077
          export VEX_UPLOAD_STORE_FILE="$RUNNER_TEMP/vex-release.jks"
          trap 'rm -f "$VEX_UPLOAD_STORE_FILE"' EXIT
          bash scripts/verify_android_signing_secret.sh cc569dfaa4c2c82379669b7c13606eb268cc3eba90a9c88e20a2d4500daf8470
          python3 -c 'import base64,os; open(os.environ["VEX_UPLOAD_STORE_FILE"],"wb").write(base64.b64decode(os.environ["ANDROID_RELEASE_KEYSTORE_BASE64"],validate=True))'
          export EXPO_PUBLIC_SENTRY_RELEASE="vex-android@${{ needs.prepare.outputs.version }}+${{ needs.prepare.outputs.build }}"
          npm run android:release -- --no-daemon
          (cd android && ./gradlew :app:testDebugUnitTest --no-daemon)
          python3 scripts/client_release.py bundle --directory dist/android
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-bundle
          path: dist/android/*
          if-no-files-found: error
          retention-days: 3
      - name: Always remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/vex-release.jks"
  macos:
    name: Build signed native macOS
    needs:
      - prepare
      - quality
    if: needs.prepare.outputs.platform == 'macos' && needs.prepare.outputs.dry_run == 'false' && github.ref_type == 'tag'
    environment: client-release-signing
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VEX_NATIVE_VERSION: ${{ needs.prepare.outputs.version }}
      VEX_NATIVE_BUILD: ${{ needs.prepare.outputs.build }}
      VEX_NATIVE_CHANGELOG: Automated verified native macOS release
      VEX_NATIVE_PRODUCTION: "1"
      VEX_NATIVE_SIGNING_MODE: self-signed
      VEX_NATIVE_REQUIRE_DEVELOPER_ID: "0"
      VEX_NATIVE_DISTRIBUTION_MODE: self-signed
      VEX_NATIVE_BUILD_PKG: "0"
      VEX_NOTARIZE: "0"
      VEX_SPARKLE_PUBLIC_ED_KEY: ${{ vars.VEX_SPARKLE_PUBLIC_ED_KEY }}
      VEX_SELF_SIGNED_APP_CERT_SHA256: ${{ vars.VEX_SELF_SIGNED_APP_CERT_SHA256 }}
      VEX_SPARKLE_FEED_URL: https://vexguard.app/v1/app/releases/macos/appcast.xml
      VEX_SPARKLE_DOWNLOAD_URL_PREFIX: https://github.com/ibotpafos/vex-client/releases/download/${{ needs.prepare.outputs.tag }}
    steps:
      - *a1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-plan
          path: .
      - name: Import and pin self-signed application identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/vex-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          app_p12="${RUNNER_TEMP}/vex-application.p12"
          app_cert="${RUNNER_TEMP}/vex-application.pem"
          sparkle_key="${RUNNER_TEMP}/sparkle-ed25519-private.key"
          printf '%s' "${VEX_MACOS_APPLICATION_P12_BASE64}" | base64 --decode > "${app_p12}"
          printf '%s' "${VEX_SPARKLE_PRIVATE_ED_KEY_BASE64}" | base64 --decode > "${sparkle_key}"
          chmod 600 "${app_p12}" "${sparkle_key}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          security import "${app_p12}" -k "${keychain}" -P "${VEX_MACOS_APPLICATION_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}"
          security find-certificate -c 'VEX Self-Signed Application' -p "${keychain}" > "${app_cert}"
          subject="$(openssl x509 -in "${app_cert}" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
          issuer="$(openssl x509 -in "${app_cert}" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          [[ "${subject}" == "${issuer}" ]] || { echo "self-signed certificate requires subject=issuer" >&2; exit 2; }
          actual_sha="$(openssl x509 -in "${app_cert}" -outform DER | shasum -a 256 | awk '{print $1}')"
          expected_sha="$(printf '%s' "${VEX_SELF_SIGNED_APP_CERT_SHA256}" | tr '[:upper:]' '[:lower:]')"
          [[ "${actual_sha}" == "${expected_sha}" ]] || { echo "self-signed application certificate fingerprint mismatch" >&2; exit 2; }
          app_identity="$(security find-certificate -c 'VEX Self-Signed Application' -Z "${keychain}" | sed -n 's/^SHA-1 hash: //p' | head -n 1)"
          [[ "${app_identity}" =~ ^[0-9A-F]{40}$ ]] || { echo "self-signed application private identity is unavailable" >&2; exit 2; }
          {
            echo "keychain=${keychain}"
            echo "app_p12=${app_p12}"
            echo "app_cert=${app_cert}"
            echo "sparkle_key=${sparkle_key}"
            echo "app_identity=${app_identity}"
          } >> "${GITHUB_OUTPUT}"
        env:
          VEX_MACOS_APPLICATION_P12_BASE64: ${{ secrets.VEX_MACOS_APPLICATION_P12_BASE64 }}
          VEX_MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.VEX_MACOS_APPLICATION_P12_PASSWORD }}
          VEX_SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.VEX_SPARKLE_PRIVATE_ED_KEY_BASE64 }}
      - name: Build verified Sparkle bundle
        env:
          VEX_SPARKLE_PRIVATE_ED_KEY_FILE: ${{ steps.signing.outputs.sparkle_key }}
          VEX_CODESIGN_IDENTITY: ${{ steps.signing.outputs.app_identity }}
          VEX_CODESIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          VEX_CODESIGN_TIMESTAMP: none
        run: |-
          set -euo pipefail
          swift test --package-path macos-native
          bash scripts/build_native_macos_internal_release.sh
          bash scripts/prepare_native_macos_deploy_bundle.sh
          python3 scripts/client_release.py bundle --directory dist/native-macos/deploy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-bundle
          path: dist/native-macos/deploy/*
          if-no-files-found: error
          retention-days: 3
      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          set +e
          security delete-keychain "${RUNNER_TEMP}/vex-release.keychain-db" 2>/dev/null
          rm -f \
            "${RUNNER_TEMP}/vex-application.p12" \
            "${RUNNER_TEMP}/vex-application.pem" \
            "${RUNNER_TEMP}/sparkle-ed25519-private.key"
  publish:
    name: Publish immutable release
    needs:
      - prepare
      - quality
      - android
      - macos
    if: always() && needs.prepare.result == 'success' && needs.quality.result == 'success' && needs.prepare.outputs.dry_run == 'false' && (needs.android.result == 'success' || needs.macos.result == 'success')
    environment: client-release-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - *a1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-plan
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release-bundle
          path: verified-release
      - name: Verify immutable bundle again
        run: python3 scripts/client_release.py verify --directory verified-release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: verified-release/*
      - name: Publish only verified final draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/client_release.py publish --directory verified-release
      - name: Website receipt gate
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PLATFORM: ${{ needs.prepare.outputs.platform }}
        run: python3 scripts/verify_release_receipt.py --manifest verified-release/vex-release.json
