name: Native macOS Self-Signed Production Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version, for example 0.1.87"
        required: true
      release_build:
        description: "Monotonic numeric build"
        required: true
      release_notes:
        description: "User-facing release notes"
        required: true

permissions:
  contents: read

concurrency:
  group: native-macos-production-release
  cancel-in-progress: false

jobs:
  build_self_signed_release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VEX_NATIVE_VERSION: ${{ inputs.release_version }}
      VEX_NATIVE_BUILD: ${{ inputs.release_build }}
      VEX_NATIVE_CHANGELOG: ${{ inputs.release_notes }}
      VEX_NATIVE_PRODUCTION: "1"
      VEX_NATIVE_SIGNING_MODE: self-signed
      VEX_NATIVE_REQUIRE_DEVELOPER_ID: "0"
      VEX_NATIVE_DISTRIBUTION_MODE: self-signed
      VEX_NATIVE_BUILD_PKG: "0"
      VEX_NOTARIZE: "0"
      VEX_SPARKLE_PUBLIC_ED_KEY: ${{ vars.VEX_SPARKLE_PUBLIC_ED_KEY }}
      VEX_SELF_SIGNED_APP_CERT_SHA256: ${{ vars.VEX_SELF_SIGNED_APP_CERT_SHA256 }}
      VEX_MACOS_APPLICATION_P12_BASE64: ${{ secrets.VEX_MACOS_APPLICATION_P12_BASE64 }}
      VEX_MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.VEX_MACOS_APPLICATION_P12_PASSWORD }}
      VEX_SPARKLE_PRIVATE_ED_KEY_BASE64: ${{ secrets.VEX_SPARKLE_PRIVATE_ED_KEY_BASE64 }}
      VEX_RELEASE_REPOSITORY_TOKEN: ${{ secrets.VEX_RELEASE_REPOSITORY_TOKEN }}

    steps:
      - name: Checkout native client
        uses: actions/checkout@v4

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            VEX_NATIVE_VERSION VEX_NATIVE_BUILD VEX_NATIVE_CHANGELOG
            VEX_SPARKLE_PUBLIC_ED_KEY VEX_SELF_SIGNED_APP_CERT_SHA256
            VEX_MACOS_APPLICATION_P12_BASE64 VEX_MACOS_APPLICATION_P12_PASSWORD
            VEX_SPARKLE_PRIVATE_ED_KEY_BASE64 VEX_RELEASE_REPOSITORY_TOKEN
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "missing required release input: ${name}" >&2; exit 2; }
          done
          [[ "${VEX_NATIVE_BUILD}" =~ ^[0-9]+$ ]] || { echo "release_build must be numeric" >&2; exit 2; }
          [[ "${VEX_SELF_SIGNED_APP_CERT_SHA256}" =~ ^[0-9A-Fa-f]{64}$ ]] || { echo "invalid self-signed certificate pin" >&2; exit 2; }

      - name: Checkout production downloads repository
        uses: actions/checkout@v4
        with:
          repository: ibotpafos/VPN
          path: vpn-main
          token: ${{ env.VEX_RELEASE_REPOSITORY_TOKEN }}

      - name: Import and pin self-signed application identity
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/vex-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          app_p12="${RUNNER_TEMP}/vex-application.p12"
          app_cert="${RUNNER_TEMP}/vex-application.pem"
          sparkle_key="${RUNNER_TEMP}/sparkle-ed25519-private.key"
          printf '%s' "${VEX_MACOS_APPLICATION_P12_BASE64}" | base64 --decode > "${app_p12}"
          printf '%s' "${VEX_SPARKLE_PRIVATE_ED_KEY_BASE64}" | base64 --decode > "${sparkle_key}"
          chmod 600 "${app_p12}" "${sparkle_key}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          security import "${app_p12}" -k "${keychain}" -P "${VEX_MACOS_APPLICATION_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}"
          security find-certificate -c 'VEX Self-Signed Application' -p "${keychain}" > "${app_cert}"
          subject="$(openssl x509 -in "${app_cert}" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
          issuer="$(openssl x509 -in "${app_cert}" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          [[ "${subject}" == "${issuer}" ]] || { echo "self-signed certificate requires subject=issuer" >&2; exit 2; }
          actual_sha="$(openssl x509 -in "${app_cert}" -outform DER | shasum -a 256 | awk '{print $1}')"
          expected_sha="$(printf '%s' "${VEX_SELF_SIGNED_APP_CERT_SHA256}" | tr '[:upper:]' '[:lower:]')"
          [[ "${actual_sha}" == "${expected_sha}" ]] || { echo "self-signed application certificate fingerprint mismatch" >&2; exit 2; }
          app_identity="$(security find-certificate -c 'VEX Self-Signed Application' -Z "${keychain}" | sed -n 's/^SHA-1 hash: //p' | head -n 1)"
          [[ "${app_identity}" =~ ^[0-9A-F]{40}$ ]] || { echo "self-signed application private identity is unavailable" >&2; exit 2; }
          {
            echo "keychain=${keychain}"
            echo "app_p12=${app_p12}"
            echo "app_cert=${app_cert}"
            echo "sparkle_key=${sparkle_key}"
            echo "app_identity=${app_identity}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and verify self-signed release bundle
        shell: bash
        env:
          VEX_VPN_REPO: ${{ github.workspace }}/vpn-main
          VEX_SPARKLE_PRIVATE_ED_KEY_FILE: ${{ steps.signing.outputs.sparkle_key }}
          VEX_CODESIGN_IDENTITY: ${{ steps.signing.outputs.app_identity }}
          VEX_CODESIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          VEX_CODESIGN_TIMESTAMP: none
          RUN_DEPLOY: "0"
          RUN_LIVE_VERIFY: "0"
          RUN_METADATA_DEPLOY: "0"
          RUN_PUBLIC_PREFLIGHT: "1"
        run: bash scripts/release_native_macos_autonomous.sh

      - name: Verify release manifest policy
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("dist/native-macos/deploy/release-manifest.json").read_text())
          if manifest.get("selfSigned") is not True:
              raise SystemExit("release manifest requires selfSigned=true")
          for field in ("appleDeveloperSigned", "notarized", "gatekeeperReady"):
              if manifest.get(field) is not False:
                  raise SystemExit(f"self-signed release manifest requires {field}=false")
          print(f"self-signed native macOS release verified: {manifest['version']} ({manifest['build']})")
          PY

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: vex-native-macos-self-signed-${{ inputs.release_version }}-${{ inputs.release_build }}
          path: dist/native-macos/deploy/**
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          set +e
          security delete-keychain "${{ steps.signing.outputs.keychain }}" 2>/dev/null
          rm -f \
            "${{ steps.signing.outputs.app_p12 }}" \
            "${{ steps.signing.outputs.app_cert }}" \
            "${{ steps.signing.outputs.sparkle_key }}"
