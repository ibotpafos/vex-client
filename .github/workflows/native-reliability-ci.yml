name: Native Reliability CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: SDK 58 lock regeneration in two isolated paths
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ibotpafos/vex-client' && github.ref == 'refs/heads/codex/pr160-ios-lock-evidence'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.11"
          cache: false
      - run: npm ci
      - name: Generate and recheck CocoaPods lock, no application build
        run: bash scripts/test_ios_simulator_build.sh --regenerate-lock
