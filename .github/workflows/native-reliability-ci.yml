name: Native Reliability CI

# Standard hosted runners are free for this public repository. PR validation
# never signs, publishes, uploads release artifacts or accesses production secrets.
on:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "assets/**"
      - "modules/**"
      - "tests/**"
      - "scripts/**"
      - "android/**"
      - "macos-native/**"
      - "patches/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "app.config.*"
      - "*config*"
      - ".github/workflows/native-reliability-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "assets/**"
      - "modules/**"
      - "tests/**"
      - "scripts/**"
      - "android/**"
      - "macos-native/**"
      - "patches/**"
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "app.config.*"
      - "*config*"
      - ".github/workflows/native-reliability-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared recovery contract
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: npm ci
      - name: Check workflow with pinned actionlint
        shell: bash
        run: |
          tools_dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --output "$tools_dir/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tools_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tools_dir/actionlint.tar.gz" -C "$tools_dir" actionlint
          "$tools_dir/actionlint" .github/workflows/native-reliability-ci.yml
      - name: Verify shared client contracts and web export
        run: |
          npm run check
          npm run build:web

  android:
    name: Android network recovery
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VEX_LOCAL_RELEASE_CACHE_ROOT: ${{ github.workspace }}/.ci-cache
      VEX_LOCAL_CACHE_MOVE_EXISTING: "0"
      VEX_LOCAL_RELEASE_CACHE_STRICT: "0"
      GRADLE_USER_HOME: ${{ github.workspace }}/.ci-cache/gradle-user-home
      GOCACHE: ${{ github.workspace }}/.ci-cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.ci-cache/go-mod
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false
      - run: npm ci
      - name: Install locked Android build components
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Build and verify debug APK without release credentials
        run: npm run android:build:debug:fast -- --stacktrace --no-daemon
      - name: Test all Android debug unit suites
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

  macos:
    name: macOS affected suites
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check selected Swift toolchain
        run: swift --version
      - name: Resolve Swift package
        run: swift package --package-path macos-native resolve
      - name: Build native macOS client
        run: swift build --package-path macos-native --target VEXNativeMac
      - name: Test affected native macOS behavior
        run: |
          swift test --package-path macos-native --filter DynamicRouteEngineTests
          swift test --package-path macos-native --filter NativeParityModelTests
          swift test --package-path macos-native --filter VEXSessionStoreTests
          swift test --package-path macos-native --filter SparkleUpdateTests
          swift test --package-path macos-native --filter VEXPrivilegedHelperCoreTests/testPFEndpointRulesUseValidatedAddressFamilyAndPort
