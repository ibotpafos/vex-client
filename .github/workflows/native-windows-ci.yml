name: Sign qualified Windows candidate without promotion

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Four-part Windows candidate version; artifacts only"
        required: true
        default: "0.1.36.0"

permissions:
  contents: read

concurrency:
  group: windows-signing-a135260-candidate
  cancel-in-progress: false

jobs:
  sign_qualified_candidate:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'ibotpafos/vex-client' &&
          github.ref == 'refs/heads/codex/signing-windows-a135260-20261011' }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout the independently qualified application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: a13526075803986eebc396ec24fdc865d00ab5c0
          persist-credentials: false

      - name: Bind signing to the exact qualified source before credentials
        shell: pwsh
        env:
          ORCHESTRATOR_SHA: ${{ github.sha }}
          ORCHESTRATOR_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne 'a13526075803986eebc396ec24fdc865d00ab5c0') { throw 'Qualified source commit mismatch.' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cne 'a47fd44b6166de98c64263554e6c981c896a8559') { throw 'Qualified source tree mismatch.' }
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $tracked.Count -ne 0) { throw 'Qualified tracked source is not clean.' }
          $evidence = Join-Path $env:RUNNER_TEMP 'vex-windows-signing-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          [ordered]@{
            schema = 'vex.windows-candidate-source.v1'; application_commit = $head; application_tree = $tree
            orchestrator_commit = $env:ORCHESTRATOR_SHA; orchestrator_ref = $env:ORCHESTRATOR_REF
            tracked_source_clean = $true; repository = 'ibotpafos/vex-client'
            deploy = $false; promotion = $false; update_manifest_generation = $false
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'source-binding.json') -Encoding utf8NoBOM

      - name: Fail closed on missing existing Windows signing inputs
        id: input_gate
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          VEX_WINDOWS_PACKAGE_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_NAME }}
          VEX_WINDOWS_PACKAGE_DISPLAY_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_DISPLAY_NAME }}
          VEX_WINDOWS_PACKAGE_PUBLISHER: ${{ vars.VEX_WINDOWS_PACKAGE_PUBLISHER }}
          VEX_WINDOWS_PACKAGE_PUBLISHER_DISPLAY_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_PUBLISHER_DISPLAY_NAME }}
          VEX_WINDOWS_PACKAGE_BASE_URI: ${{ vars.VEX_WINDOWS_PACKAGE_BASE_URI }}
          VEX_WINDOWS_APPINSTALLER_BASE_URI: ${{ vars.VEX_WINDOWS_APPINSTALLER_BASE_URI }}
          VEX_WINDOWS_UPDATE_KEY_ID: ${{ vars.VEX_WINDOWS_UPDATE_KEY_ID }}
          VEX_WINDOWS_SIGN_PFX_BASE64: ${{ secrets.VEX_WINDOWS_SIGN_PFX_BASE64 }}
          VEX_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.VEX_WINDOWS_SIGN_PFX_PASSWORD }}
          VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64 }}
          VEX_WINDOWS_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.VEX_WINDOWS_UPDATE_PRIVATE_KEY_BASE64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH_ARM64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_URI_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_URI_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_URI_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_URI_ARM64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_SHA256_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_SHA256_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_SHA256_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_SHA256_ARM64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $required = @('RELEASE_VERSION', 'VEX_WINDOWS_PACKAGE_NAME', 'VEX_WINDOWS_PACKAGE_DISPLAY_NAME',
            'VEX_WINDOWS_PACKAGE_PUBLISHER', 'VEX_WINDOWS_PACKAGE_PUBLISHER_DISPLAY_NAME',
            'VEX_WINDOWS_PACKAGE_BASE_URI', 'VEX_WINDOWS_APPINSTALLER_BASE_URI', 'VEX_WINDOWS_UPDATE_KEY_ID',
            'VEX_WINDOWS_SIGN_PFX_BASE64', 'VEX_WINDOWS_SIGN_PFX_PASSWORD',
            'VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64', 'VEX_WINDOWS_UPDATE_PRIVATE_KEY_BASE64')
          $statuses = @($required | ForEach-Object {
            [ordered]@{ name = $_; present = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          })
          $runtimeReady = $true
          foreach ($architecture in @('X64', 'ARM64')) {
            foreach ($asset in @('AMNEZIAWG', 'WINTUN')) {
              $prefix = "VEX_WINDOWS_SERVICE_$asset"
              $names = @("${prefix}_PATH", "${prefix}_PATH_$architecture", "${prefix}_URI_$architecture", "${prefix}_SHA256_$architecture")
              foreach ($name in $names) { $statuses += [ordered]@{ name = $name; present = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name)) } }
              $uri = [Environment]::GetEnvironmentVariable("${prefix}_URI_$architecture")
              $path = [Environment]::GetEnvironmentVariable("${prefix}_PATH_$architecture")
              $legacy = [Environment]::GetEnvironmentVariable("${prefix}_PATH")
              $hash = [Environment]::GetEnvironmentVariable("${prefix}_SHA256_$architecture")
              $ready = if (-not [string]::IsNullOrWhiteSpace($uri)) { $hash -match '^[0-9A-Fa-f]{64}$' } else { -not [string]::IsNullOrWhiteSpace($path) -or -not [string]::IsNullOrWhiteSpace($legacy) }
              if (-not $ready) { $runtimeReady = $false }
            }
          }
          $requiredReady = @($statuses | Where-Object { $_.name -in $required -and -not $_.present }).Count -eq 0
          $versionValid = $env:RELEASE_VERSION -match '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ($versionValid) {
            foreach ($part in $env:RELEASE_VERSION.Split('.')) {
              $number = 0
              if (-not [int]::TryParse($part, [ref]$number) -or $number -gt 65535) { $versionValid = $false }
            }
          }
          $passed = $requiredReady -and $runtimeReady -and $versionValid
          $statuses | ForEach-Object { Write-Host "$($_.name): $(if ($_.present) { 'present' } else { 'missing' })" }
          [ordered]@{ schema = 'vex.windows-signing-input-gate.v1'; inputs = $statuses
            required_inputs_present = $requiredReady; runtime_input_groups_ready = $runtimeReady
            release_version_format_valid = $versionValid; passed = $passed; values_disclosed = $false
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'vex-windows-signing-evidence/input-gate.json') -Encoding utf8NoBOM
          if (-not $passed) { throw 'Existing Windows signing inputs are incomplete or invalid; see names-only input-gate.json.' }

      - name: Verify the existing trusted publisher and matching update keys
        id: trust
        shell: pwsh
        env:
          VEX_WINDOWS_PACKAGE_PUBLISHER: ${{ vars.VEX_WINDOWS_PACKAGE_PUBLISHER }}
          VEX_WINDOWS_SIGN_PFX_BASE64: ${{ secrets.VEX_WINDOWS_SIGN_PFX_BASE64 }}
          VEX_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.VEX_WINDOWS_SIGN_PFX_PASSWORD }}
          VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64 }}
          VEX_WINDOWS_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.VEX_WINDOWS_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $pfx = $private = $public = $certificate = $chain = $null
          $receipt = [ordered]@{ schema = 'vex.windows-signing-trust-preflight.v1'; passed = $false; failure_stage = 'decode'
            certificate_sha256 = $null; trusted_chain = $false; code_signing_eku = $false; publisher_matches = $false
            certificate_self_issued = $null; update_keypair_matches = $false; private_key_material_written = $false }
          try {
            $pfx = [Convert]::FromBase64String($env:VEX_WINDOWS_SIGN_PFX_BASE64)
            $private = [Convert]::FromBase64String($env:VEX_WINDOWS_UPDATE_PRIVATE_KEY_BASE64)
            $public = [Convert]::FromBase64String($env:VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64)
            $receipt.failure_stage = 'publisher_certificate'
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:VEX_WINDOWS_SIGN_PFX_PASSWORD, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            $receipt.certificate_sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($certificate.RawData))
            $receipt.certificate_self_issued = $certificate.Subject -ceq $certificate.Issuer
            $receipt.publisher_matches = $certificate.Subject -ceq $env:VEX_WINDOWS_PACKAGE_PUBLISHER.Trim()
            $eku = @($certificate.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' })
            $receipt.code_signing_eku = @($eku | ForEach-Object { $_.EnhancedKeyUsages } | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }).Count -gt 0
            $now = [DateTime]::UtcNow
            if (-not $certificate.HasPrivateKey -or $receipt.certificate_self_issued -or -not $receipt.publisher_matches -or -not $receipt.code_signing_eku -or $now -lt $certificate.NotBefore.ToUniversalTime() -or $now -gt $certificate.NotAfter.ToUniversalTime()) { throw 'Publisher identity admission failed.' }
            $receipt.failure_stage = 'trusted_certificate_chain'
            $chain = [Security.Cryptography.X509Certificates.X509Chain]::new()
            $chain.ChainPolicy.VerificationFlags = [Security.Cryptography.X509Certificates.X509VerificationFlags]::NoFlag
            $chain.ChainPolicy.RevocationMode = [Security.Cryptography.X509Certificates.X509RevocationMode]::Online
            $chain.ChainPolicy.RevocationFlag = [Security.Cryptography.X509Certificates.X509RevocationFlag]::ExcludeRoot
            $chain.ChainPolicy.UrlRetrievalTimeout = [TimeSpan]::FromSeconds(15)
            $receipt.trusted_chain = $chain.Build($certificate)
            if (-not $receipt.trusted_chain) { throw 'Existing publisher chain verification failed.' }
            $receipt.failure_stage = 'update_keypair'
            # The span-only import APIs run in C#, avoiding PowerShell argument binding.
            Add-Type -TypeDefinition @'
          using System;
          using System.Security.Cryptography;
          using System.Text;
          public static class VexCandidateUpdateKeyAdmission {
              public static bool Matches(byte[] privateBytes, byte[] publicBytes) {
                  using var signer = ECDsa.Create();
                  using var verifier = ECDsa.Create();
                  int consumed;
                  try { signer.ImportPkcs8PrivateKey(privateBytes, out consumed); }
                  catch (CryptographicException) { signer.ImportECPrivateKey(privateBytes, out consumed); }
                  if (consumed != privateBytes.Length || signer.ExportParameters(false).Curve.Oid.Value != "1.2.840.10045.3.1.7") return false;
                  verifier.ImportSubjectPublicKeyInfo(publicBytes, out consumed);
                  if (consumed != publicBytes.Length || !CryptographicOperations.FixedTimeEquals(signer.ExportSubjectPublicKeyInfo(), publicBytes)) return false;
                  byte[] payload = Encoding.UTF8.GetBytes("vex.windows-a135260-candidate-keypair-test");
                  byte[] signature = signer.SignData(payload, HashAlgorithmName.SHA256, DSASignatureFormat.Rfc3279DerSequence);
                  try { return verifier.VerifyData(payload, signature, HashAlgorithmName.SHA256, DSASignatureFormat.Rfc3279DerSequence); }
                  finally { CryptographicOperations.ZeroMemory(payload); CryptographicOperations.ZeroMemory(signature); }
              }
          }
          '@
            $receipt.update_keypair_matches = [VexCandidateUpdateKeyAdmission]::Matches($private, $public)
            if (-not $receipt.update_keypair_matches) { throw 'Existing update keypair verification failed.' }
            $receipt.passed = $true
            $receipt.failure_stage = $null
            "certificate_sha256=$($receipt.certificate_sha256)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Existing CA-trusted publisher and matching P-256 update keys verified.'
          }
          catch { throw "Windows signing trust preflight failed at $($receipt.failure_stage); no secret values are included in this diagnostic." }
          finally {
            foreach ($bytes in @($pfx, $private, $public)) { if ($null -ne $bytes) { [Array]::Clear($bytes, 0, $bytes.Length) } }
            foreach ($owned in @($certificate, $chain)) { if ($null -ne $owned) { $owned.Dispose() } }
            $receipt | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'vex-windows-signing-evidence/trust-preflight.json') -Encoding utf8NoBOM
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Stage pinned architecture-specific vendor runtimes
        shell: pwsh
        env:
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH_ARM64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_URI_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_URI_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_URI_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_URI_ARM64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_SHA256_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_SHA256_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_SHA256_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_SHA256_ARM64 }}
        run: ./native-windows/scripts/stage-runtime-assets.ps1 -DestinationRoot (Join-Path $env:RUNNER_TEMP 'vex-windows-signing-candidate/runtime')

      - name: Build and sign both candidate architectures with the existing packager
        shell: pwsh
        env:
          VEX_WINDOWS_RELEASE_VERSION: ${{ inputs.release_version }}
          VEX_WINDOWS_RELEASE_CHANNEL: candidate
          VEX_WINDOWS_PACKAGE_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_NAME }}
          VEX_WINDOWS_PACKAGE_DISPLAY_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_DISPLAY_NAME }}
          VEX_WINDOWS_PACKAGE_PUBLISHER: ${{ vars.VEX_WINDOWS_PACKAGE_PUBLISHER }}
          VEX_WINDOWS_PACKAGE_PUBLISHER_DISPLAY_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_PUBLISHER_DISPLAY_NAME }}
          VEX_WINDOWS_PACKAGE_BASE_URI: ${{ vars.VEX_WINDOWS_PACKAGE_BASE_URI }}
          VEX_WINDOWS_APPINSTALLER_BASE_URI: ${{ vars.VEX_WINDOWS_APPINSTALLER_BASE_URI }}
          VEX_WINDOWS_UPDATE_KEY_ID: ${{ vars.VEX_WINDOWS_UPDATE_KEY_ID }}
          VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64 }}
          VEX_WINDOWS_SIGN_PFX_BASE64: ${{ secrets.VEX_WINDOWS_SIGN_PFX_BASE64 }}
          VEX_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.VEX_WINDOWS_SIGN_PFX_PASSWORD }}
          VEX_WINDOWS_SIGN_TIMESTAMP_URI: ${{ vars.VEX_WINDOWS_SIGN_TIMESTAMP_URI }}
          VEX_WINDOWS_SERVICE_PROFILE_KEYRING_PATH: native-windows/packaging/profile-signing-keys.json
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $packages = Join-Path $env:RUNNER_TEMP 'vex-windows-signing-candidate/packages'
          foreach ($architecture in @('x64', 'arm64')) {
            ./native-windows/packaging/package-native-windows.ps1 -Architecture $architecture -Channel candidate -OutputRoot $packages
          }

      - name: Verify signatures and retain only the complete signed candidate set
        id: verification
        shell: pwsh
        env:
          EXPECTED_CERTIFICATE_SHA256: ${{ steps.trust.outputs.certificate_sha256 }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $packages = Join-Path $env:RUNNER_TEMP 'vex-windows-signing-candidate/packages'
          $output = Join-Path $env:RUNNER_TEMP 'vex-windows-signed-candidate'
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -LiteralPath $kitRoot -Directory | Sort-Object Name -Descending |
            ForEach-Object { $candidate = Join-Path $_.FullName 'x64/signtool.exe'; if (Test-Path -LiteralPath $candidate -PathType Leaf) { $candidate } } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($signtool)) { throw 'Windows SDK Authenticode verifier is unavailable.' }
          $receipts = @()
          foreach ($architecture in @('x64', 'arm64')) {
            $metadataFiles = @(Get-ChildItem -LiteralPath (Join-Path $packages "candidate/$architecture") -Filter 'package-metadata.json' -File -Recurse)
            if ($metadataFiles.Count -ne 1) { throw 'Candidate metadata must be unique for each architecture.' }
            $metadataFile = $metadataFiles[0]
            $metadata = Get-Content -LiteralPath $metadataFile.FullName -Raw | ConvertFrom-Json
            if ($metadata.schema -cne 'vex.windows-package-output.v2' -or $metadata.channel -cne 'candidate' -or $metadata.version -cne $env:RELEASE_VERSION -or $metadata.architecture -cne $architecture -or $metadata.client_certificate_sha256 -cne $env:EXPECTED_CERTIFICATE_SHA256) { throw 'Candidate identity binding failed.' }
            $packageRoot = $metadataFile.Directory.FullName
            $signedFiles = @(
              @{ path = 'package/Vex.Windows.App.exe'; hash_field = 'app_executable_sha256' },
              @{ path = 'package/Vex.Windows.Service.exe'; hash_field = 'service_executable_sha256' },
              @{ path = $metadata.bootstrap_file; hash_field = 'bootstrap_sha256' },
              @{ path = $metadata.install_service_script_file; hash_field = 'install_service_script_sha256' },
              @{ path = $metadata.uninstall_service_script_file; hash_field = 'uninstall_service_script_sha256' })
            $signatureReceipts = @()
            foreach ($entry in $signedFiles) {
              $path = Join-Path $packageRoot $entry.path
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or $null -eq $signature.SignerCertificate -or $null -eq $signature.TimeStamperCertificate) { throw 'A candidate file lacks a valid timestamped Authenticode signature.' }
              $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData))
              if ($fingerprint -cne $env:EXPECTED_CERTIFICATE_SHA256) { throw 'Candidate signer fingerprint differs from the admitted publisher.' }
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
              if ($hash -cne $metadata.($entry.hash_field)) { throw 'Candidate signed-file hash differs from package metadata.' }
              $signatureReceipts += [ordered]@{ file = $entry.path; sha256 = $hash; certificate_sha256 = $fingerprint; signature_valid = $true; timestamp_present = $true }
            }
            $msix = Join-Path $packageRoot $metadata.package_file
            if ((Get-FileHash -LiteralPath $msix -Algorithm SHA256).Hash -cne $metadata.package_sha256) { throw 'Signed MSIX hash differs from package metadata.' }
            & $signtool verify /pa /all $msix
            if ($LASTEXITCODE -ne 0) { throw 'Independent signed MSIX Authenticode verification failed.' }
            $destination = Join-Path $output $architecture
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            foreach ($name in @($metadata.package_file, $metadata.bootstrap_file, $metadata.install_service_script_file, $metadata.uninstall_service_script_file, 'package-metadata.json')) {
              Copy-Item -LiteralPath (Join-Path $packageRoot $name) -Destination (Join-Path $destination $name)
            }
            $receipts += [ordered]@{ architecture = $architecture; msix_sha256 = $metadata.package_sha256; msix_size_bytes = $metadata.package_size_bytes; independent_msix_signtool_verification = $true; files = $signatureReceipts }
          }
          $sourceHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceHead -cne 'a13526075803986eebc396ec24fdc865d00ab5c0') { throw 'Signing source commit changed.' }
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceTree -cne 'a47fd44b6166de98c64263554e6c981c896a8559') { throw 'Signing source tree changed.' }
          git diff --exit-code HEAD -- | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Signing modified qualified tracked source.' }
          [ordered]@{ schema = 'vex.windows-signed-candidate-verification.v1'; source_commit = $sourceHead; source_tree = $sourceTree; architectures = $receipts; complete_set = $true; deploy = $false; update_manifest_generation = $false; installed_or_started = $false } |
            ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'vex-windows-signing-evidence/signature-verification.json') -Encoding utf8NoBOM

      - name: Remove owned signing staging and verify artifact secret exclusion
        if: always()
        id: cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $staging = Join-Path $env:RUNNER_TEMP 'vex-windows-signing-candidate'
          if (Test-Path -LiteralPath $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'vex-windows-signed-candidate'
          $forbidden = @()
          if (Test-Path -LiteralPath $artifactRoot) {
            $forbidden = @(Get-ChildItem -LiteralPath $artifactRoot -File -Recurse | Where-Object { $_.Extension.ToLowerInvariant() -in @('.pfx', '.p12', '.key', '.pem', '.jks', '.keystore') })
          }
          $removed = -not (Test-Path -LiteralPath $staging)
          $evidence = Join-Path $env:RUNNER_TEMP 'vex-windows-signing-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          [ordered]@{ schema = 'vex.windows-candidate-signing-cleanup.v1'; owned_staging_removed = $removed; forbidden_secret_file_count = $forbidden.Count; certificate_store_modified = $false; service_installed = $false; applications_started = $false; network_policy_modified = $false } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'cleanup.json') -Encoding utf8NoBOM
          if (-not $removed -or $forbidden.Count -ne 0) { throw 'Owned signing material cleanup or artifact exclusion failed.' }

      - name: Retain names-only signing and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vex-windows-signing-a135260-evidence
          path: ${{ runner.temp }}/vex-windows-signing-evidence/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain the verified signed candidate without promotion
        if: ${{ success() && steps.verification.outcome == 'success' && steps.cleanup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vex-windows-signed-a135260-candidate
          path: ${{ runner.temp }}/vex-windows-signed-candidate/**
          if-no-files-found: error
          retention-days: 7
