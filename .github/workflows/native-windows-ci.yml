name: Native Windows CI

# Reopened by the owner on 2026-10-10. Routine validation stays unsigned;
# the manual packaging job produces artifacts for review, without promotion.
on:
  pull_request:
    paths:
      - "native-windows/**"
      - "scripts/*native_windows*"
      - "versions.json"
      - ".github/workflows/native-windows-ci.yml"
  push:
    branches: [main]
    paths:
      - "native-windows/**"
      - "scripts/*native_windows*"
      - "versions.json"
      - ".github/workflows/native-windows-ci.yml"
  workflow_dispatch:
    inputs:
      package_release:
        description: "Prepare signed x64/arm64 artifacts for release review"
        type: boolean
        default: false
      full_tunnel_checks:
        description: "Exercise full routing and AntiLeak on a fresh disposable Windows runner"
        type: boolean
        default: false
      release_version:
        description: "Windows package version (for example 1.2.3.4; packaging only)"
        required: false
      manifest_revision:
        description: "Monotonic signed update manifest revision (packaging only)"
        required: false
      release_notes:
        description: "User-facing Windows release notes (packaging only)"
        required: false
      rollout_percent:
        description: "Initial stable rollout percentage (0-100)"
        default: "10"
      minimum_supported_version:
        description: "Oldest native Windows version allowed to update"
        required: false
      required_version_floor:
        description: "Mandatory security floor (defaults to minimum supported or 0.0.0.0)"
        required: false
      required_update:
        description: "Mark the update as mandatory"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable client and release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Reject signed preparation outside main
        if: github.event_name == 'workflow_dispatch' && inputs.package_release && github.ref != 'refs/heads/main'
        run: |
          echo 'Signed Windows release preparation requires the reviewed main branch.' >&2
          exit 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Validate XAML and packaging contracts
        run: |
          node scripts/validate_native_windows_xaml.mjs
          node native-windows/scripts/validate-packaging-static.mjs
      - name: Parse every PowerShell script and test release validation
        shell: pwsh
        run: |
          ./native-windows/scripts/validate-powershell-parse.ps1
          ./native-windows/tests/ReleaseValidation.Tests.ps1
          ./native-windows/tests/ReleaseReadiness.Tests.ps1
          ./native-windows/tests/VclibsDependency.Tests.ps1
          ./native-windows/tests/VerifiedBootstrapLaunch.Tests.ps1
          ./native-windows/tests/VendorStartupMigration.Tests.ps1
          ./native-windows/tests/SignedInstallAcceptance.Tests.ps1
          ./native-windows/tests/SetupPackaging.Tests.ps1
          ./native-windows/tests/WindowsSetupGuard.Tests.ps1
          ./native-windows/tests/NetworkSafetyPolicy.Tests.ps1
          ./native-windows/tests/BootstrapOwnership.Tests.ps1
          ./native-windows/tests/InstallerSafety.Tests.ps1
          ./native-windows/tests/VpnAcceptance.Tests.ps1
          ./native-windows/tests/SmokeApplication.Tests.ps1
          ./native-windows/tests/UiPreviewProtocolRegistration.Tests.ps1
          ./native-windows/tests/UiPreviewContext.Tests.ps1
      - name: Test platform-neutral core and control plane
        run: dotnet run --project native-windows/tests/Vex.Windows.Core.Tests/Vex.Windows.Core.Tests.csproj -c Release

  build:
    name: Windows ${{ matrix.architecture }} application and VPN service
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install libsodium Visual C++ prerequisite
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vc-redist-x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Visual C++ redistributable signature verification failed.'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1638, 3010)) { throw "Visual C++ installation failed: $($process.ExitCode)" }
      - name: Test native contracts on Windows
        if: matrix.architecture == 'x64'
        run: dotnet run --project native-windows/tests/Vex.Windows.Core.Tests/Vex.Windows.Core.Tests.csproj -c Release
      - name: Validate native surfaces and release scripts
        shell: pwsh
        run: |
          ./native-windows/scripts/validate-powershell-parse.ps1
          ./native-windows/tests/ReleaseValidation.Tests.ps1
          ./native-windows/tests/ReleaseReadiness.Tests.ps1
          ./native-windows/tests/VclibsDependency.Tests.ps1
          ./native-windows/tests/VerifiedBootstrapLaunch.Tests.ps1
          ./native-windows/tests/VendorStartupMigration.Tests.ps1
          ./native-windows/tests/SignedInstallAcceptance.Tests.ps1
          ./native-windows/tests/SetupPackaging.Tests.ps1
          ./native-windows/tests/WindowsSetupGuard.Tests.ps1
          ./native-windows/tests/NetworkSafetyPolicy.Tests.ps1
          ./native-windows/tests/BootstrapOwnership.Tests.ps1
          ./native-windows/tests/InstallerSafety.Tests.ps1
          ./native-windows/tests/VpnAcceptance.Tests.ps1
          ./native-windows/tests/SmokeApplication.Tests.ps1
          ./native-windows/tests/UiPreviewProtocolRegistration.Tests.ps1
          ./native-windows/tests/UiPreviewContext.Tests.ps1
          node native-windows/scripts/validate-packaging-static.mjs
          node scripts/validate_native_windows_xaml.mjs
      - name: Exercise isolated installer functions in Windows PowerShell 5.1
        if: matrix.architecture == 'x64'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $hostPath = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::System)) 'WindowsPowerShell/v1.0/powershell.exe'
          & $hostPath -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'The production Windows PowerShell host is unavailable.' }
          foreach ($test in @('InstallerSafety.Tests.ps1', 'BootstrapOwnership.Tests.ps1', 'ReleaseReadiness.Tests.ps1', 'VclibsDependency.Tests.ps1', 'VerifiedBootstrapLaunch.Tests.ps1', 'VendorStartupMigration.Tests.ps1', 'SignedInstallAcceptance.Tests.ps1', 'SetupPackaging.Tests.ps1', 'WindowsSetupGuard.Tests.ps1')) {
            & $hostPath -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $PWD "native-windows/tests/$test")
            if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 isolated installer test failed: $test" }
          }
      - name: Publish self-contained VPN service
        run: dotnet publish native-windows/src/Vex.Windows.Service/Vex.Windows.Service.csproj -c Release -r win-${{ matrix.architecture }} -p:Platform=${{ matrix.architecture }} -o "${{ runner.temp }}/vex-windows/service-${{ matrix.architecture }}"
      - name: Publish self-contained WinUI application
        run: dotnet publish native-windows/src/Vex.Windows.App/Vex.Windows.App.csproj -c Release -r win-${{ matrix.architecture }} -p:Platform=${{ matrix.architecture }} -o "${{ runner.temp }}/vex-windows/app-${{ matrix.architecture }}"
      - name: Publish native installer for unsigned review
        run: dotnet publish native-windows/src/Vex.Windows.Setup/Vex.Windows.Setup.csproj -c Release -r win-${{ matrix.architecture }} -p:Platform=${{ matrix.architecture }} -o "${{ runner.temp }}/vex-windows/setup-${{ matrix.architecture }}"
      - name: Verify published PE architectures and runtime resources
        shell: pwsh
        run: |
          . ./native-windows/packaging/ReleaseValidation.ps1
          $root = Join-Path $env:RUNNER_TEMP 'vex-windows'
          Assert-WindowsPeArchitecture -Path (Join-Path $root 'app-${{ matrix.architecture }}/Vex.Windows.App.exe') -Architecture '${{ matrix.architecture }}'
          Assert-WindowsPeArchitecture -Path (Join-Path $root 'service-${{ matrix.architecture }}/Vex.Windows.Service.exe') -Architecture '${{ matrix.architecture }}'
          Assert-WindowsPeArchitecture -Path (Join-Path $root 'setup-${{ matrix.architecture }}/Vex.Windows.Setup.exe') -Architecture '${{ matrix.architecture }}'
          # WindowsPackageType=None produces the assembly-named app PRI.
          Get-ChildItem -LiteralPath (Join-Path $root 'app-${{ matrix.architecture }}') -Filter '*.pri' |
            ForEach-Object { Write-Host "Published compiled resource: $($_.Name) ($($_.Length) bytes)" }
          foreach ($asset in @('Vex.Windows.App.pri', 'Assets/icon.ico', 'Assets/country-silhouettes.json', 'Assets/vex-logo-header.png', 'Assets/flags/de.svg', 'Assets/flags/fi.svg', 'Assets/flags/nl.svg', 'Microsoft.UI.Xaml.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $root "app-${{ matrix.architecture }}/$asset"))) {
              throw "Published WinUI dependency is missing: $asset"
            }
          }
      - name: Verify unsigned installer refuses installation
        if: matrix.architecture == 'x64'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vex-windows'
          $resultPath = Join-Path $root 'unsigned-setup-isolation-x64.json'
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $root 'setup-x64/Vex.Windows.Setup.exe'))
          $start.UseShellExecute = $false
          foreach ($argument in @('--verify-bundle', '--result-path', $resultPath)) { $start.ArgumentList.Add($argument) }
          $process = [Diagnostics.Process]::Start($start)
          try {
            if (-not $process.WaitForExit(30000) -or $process.ExitCode -ne 3) {
              throw 'An unsigned installer without embedded release metadata did not refuse installation.'
            }
            $setupExitCode = $process.ExitCode
          }
          finally {
            if (-not $process.HasExited) { $process.Kill($true); [void]$process.WaitForExit(5000) }
            $process.Dispose()
          }
          $result = [IO.File]::ReadAllText($resultPath) | ConvertFrom-Json
          if ($result.schema -ne 'vex.windows-setup-verification.v1' -or $result.passed -isnot [bool] -or $result.passed -or
              $result.embedded_metadata_present -isnot [bool] -or $result.embedded_metadata_present -or
              $result.bootstrap_signature_verified -isnot [bool] -or $result.bootstrap_signature_verified) {
            throw 'Unsigned installer verification reported an unsupported or unsafe result.'
          }
          $result | Add-Member -NotePropertyName exit_code -NotePropertyValue $setupExitCode
          [IO.File]::WriteAllText($resultPath, ($result | ConvertTo-Json -Depth 5), [Text.UTF8Encoding]::new($false))
      - name: Smoke x64 WinUI application startup
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vex-windows'
          ./native-windows/scripts/smoke-application.ps1 `
            -ApplicationPath (Join-Path $root 'app-x64/Vex.Windows.App.exe') `
            -ResultPath (Join-Path $root 'startup-smoke-x64.json')
      - name: Publish isolated Debug interface preview
        if: matrix.architecture == 'x64'
        run: dotnet publish native-windows/src/Vex.Windows.App/Vex.Windows.App.csproj -c Debug -r win-x64 -p:Platform=x64 -o "${{ runner.temp }}/vex-ui-preview-app"
      - name: Verify Release rejects isolated preview controls
        if: matrix.architecture == 'x64'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vex-windows'
          $application = Join-Path $root 'app-x64/Vex.Windows.App.exe'
          $arguments = @('--signed-out-ui-preview', '--focus-pulse-ui-preview', '--ui-smoke-exit',
            'vexguard-ui-preview://ui-smoke/activate', 'vexguard-ui-preview://ui-smoke/unknown',
            'vexguard-ui-preview://other-host/activate', 'vexguard-ui-preview://ui-smoke/activate?unexpected=1',
            'vexguard-ui-preview://user@ui-smoke/activate', 'vexguard-ui-preview://ui-smoke/activate#unexpected')
          foreach ($argument in $arguments) {
            $process = Start-Process -FilePath $application -ArgumentList $argument -PassThru
            try {
              if (-not $process.WaitForExit(10000) -or $process.ExitCode -ne 0) {
                throw 'Release did not refuse isolated preview control before creating the application.'
              }
            }
            finally {
              if (-not $process.HasExited) { $process.Kill($true); [void]$process.WaitForExit(5000) }
              $process.Dispose()
            }
            if (Get-Process -Name 'Vex.Windows.App' -ErrorAction SilentlyContinue) {
              throw 'Release preview control left a running application.'
            }
          }
          @{ schema = 'vex.release-preview-isolation.v1'; rejected_controls = $arguments.Count; application_absent = $true } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'release-preview-isolation-x64.json')
      - name: Exercise authenticated desktop flows and capture interface
        if: matrix.architecture == 'x64'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vex-windows'
          ./native-windows/scripts/smoke-application.ps1 `
            -ApplicationPath (Join-Path $env:RUNNER_TEMP 'vex-ui-preview-app/Vex.Windows.App.exe') `
            -DesktopChecks -PreviewMode fixtures -ObserveSeconds 3 `
            -ResultPath (Join-Path $root 'desktop-fixtures-x64.json') `
            -ScreenshotDirectory (Join-Path $root 'screenshots/fixtures')
      - name: Exercise signed-out desktop flows and capture interface
        if: matrix.architecture == 'x64'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vex-windows'
          ./native-windows/scripts/smoke-application.ps1 `
            -ApplicationPath (Join-Path $env:RUNNER_TEMP 'vex-ui-preview-app/Vex.Windows.App.exe') `
            -DesktopChecks -PreviewMode signed-out -ObserveSeconds 3 `
            -ResultPath (Join-Path $root 'desktop-signed-out-x64.json') `
            -ScreenshotDirectory (Join-Path $root 'screenshots/signed-out')
      - name: Audit all native dependencies
        shell: pwsh
        run: |
          foreach ($project in @('Vex.Windows.App', 'Vex.Windows.Client', 'Vex.Windows.Service', 'Vex.Windows.Setup')) {
            $output = dotnet package list --project "native-windows/src/$project/$project.csproj" --vulnerable --include-transitive --format json
            if ($LASTEXITCODE -ne 0) { throw "NuGet audit failed: $project" }
            $report = $output | ConvertFrom-Json
            foreach ($framework in $report.projects.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities) { throw "Vulnerable NuGet dependency: $($package.id)" }
              }
            }
          }
      - name: Retain unsigned review builds and startup evidence
        if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vex-native-windows-unsigned-${{ matrix.architecture }}
          path: ${{ runner.temp }}/vex-windows/**
          if-no-files-found: error
          retention-days: 7

  macos_reference:
    name: Capture actual macOS interface reference
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Render existing SwiftUI screens with isolated Debug fixtures
        run: native-windows/scripts/render-macos-reference.sh "$RUNNER_TEMP/macos-reference"
      - name: Retain native macOS reference images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vex-native-macos-interface-reference
          path: ${{ runner.temp }}/macos-reference/**
          if-no-files-found: error
          retention-days: 7

  vpn_acceptance:
    name: Windows x64 real encrypted tunnel acceptance
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: native-windows/scripts/vpn-fixture-peer/go.sum
      - name: Validate the qualified runtime on a disposable host
        shell: pwsh
        env:
          FULL_TUNNEL_CHECKS: ${{ github.event_name == 'workflow_dispatch' && (inputs.full_tunnel_checks || inputs.package_release) }}
        run: |
          $fullChecks = $env:FULL_TUNNEL_CHECKS -eq 'true'
          ./native-windows/scripts/invoke-vpn-acceptance.ps1 -DisposableRunner -FullTunnelChecks:$fullChecks `
            -ResultPath (Join-Path $env:RUNNER_TEMP 'vex-vpn-evidence/vpn-acceptance-x64.json')
      - name: Retain sanitized tunnel and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vex-native-windows-vpn-acceptance-x64
          path: |
            ${{ runner.temp }}/vex-vpn-evidence/vpn-acceptance-x64.json
            ${{ runner.temp }}/vex-vpn-evidence/vpn-acceptance-x64.json.cleanup.json
          if-no-files-found: error
          retention-days: 7

  package_release:
    name: Prepare signed Windows release artifacts
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.package_release &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: windows-2025
    timeout-minutes: 60
    needs: [portable, build, macos_reference, vpn_acceptance]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify release inputs and stage architecture-specific runtimes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          MANIFEST_REVISION: ${{ inputs.manifest_revision }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_PATH_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_PATH_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_PATH_ARM64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_URI_ARM64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_X64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_X64 }}
          VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_AMNEZIAWG_SHA256_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_URI_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_URI_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_URI_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_URI_ARM64 }}
          VEX_WINDOWS_SERVICE_WINTUN_SHA256_X64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_SHA256_X64 }}
          VEX_WINDOWS_SERVICE_WINTUN_SHA256_ARM64: ${{ vars.VEX_WINDOWS_SERVICE_WINTUN_SHA256_ARM64 }}
          VEX_WINDOWS_VCLIBS_PATH_X64: ${{ vars.VEX_WINDOWS_VCLIBS_PATH_X64 }}
          VEX_WINDOWS_VCLIBS_PATH_ARM64: ${{ vars.VEX_WINDOWS_VCLIBS_PATH_ARM64 }}
          VEX_WINDOWS_VCLIBS_URI_X64: ${{ vars.VEX_WINDOWS_VCLIBS_URI_X64 }}
          VEX_WINDOWS_VCLIBS_URI_ARM64: ${{ vars.VEX_WINDOWS_VCLIBS_URI_ARM64 }}
          VEX_WINDOWS_VCLIBS_SHA256_X64: ${{ vars.VEX_WINDOWS_VCLIBS_SHA256_X64 }}
          VEX_WINDOWS_VCLIBS_SHA256_ARM64: ${{ vars.VEX_WINDOWS_VCLIBS_SHA256_ARM64 }}
        run: |
          . ./native-windows/packaging/ReleaseValidation.ps1
          ConvertTo-WindowsPackageVersion $env:RELEASE_VERSION | Out-Null
          $revision = 0L
          if (-not [long]::TryParse($env:MANIFEST_REVISION, [ref]$revision) -or $revision -le 0) { throw 'A positive manifest revision is required.' }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) { throw 'Release notes are required.' }
          ./native-windows/scripts/stage-runtime-assets.ps1 -DestinationRoot (Join-Path $env:RUNNER_TEMP 'vex-native-runtime')
      - name: Package signed native Windows releases
        shell: pwsh
        env:
          VEX_WINDOWS_RELEASE_VERSION: ${{ inputs.release_version }}
          VEX_WINDOWS_RELEASE_CHANNEL: stable
          VEX_WINDOWS_MANIFEST_REVISION: ${{ inputs.manifest_revision }}
          VEX_WINDOWS_RELEASE_NOTES: ${{ inputs.release_notes }}
          VEX_WINDOWS_MINIMUM_SUPPORTED_VERSION: ${{ inputs.minimum_supported_version }}
          VEX_WINDOWS_REQUIRED_VERSION_FLOOR: ${{ inputs.required_version_floor }}
          VEX_WINDOWS_PACKAGE_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_NAME }}
          VEX_WINDOWS_PACKAGE_DISPLAY_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_DISPLAY_NAME }}
          VEX_WINDOWS_PACKAGE_PUBLISHER: ${{ vars.VEX_WINDOWS_PACKAGE_PUBLISHER }}
          VEX_WINDOWS_PACKAGE_PUBLISHER_DISPLAY_NAME: ${{ vars.VEX_WINDOWS_PACKAGE_PUBLISHER_DISPLAY_NAME }}
          VEX_WINDOWS_PACKAGE_BASE_URI: ${{ vars.VEX_WINDOWS_PACKAGE_BASE_URI }}
          VEX_WINDOWS_APPINSTALLER_BASE_URI: ${{ vars.VEX_WINDOWS_APPINSTALLER_BASE_URI }}
          VEX_WINDOWS_UPDATE_KEY_ID: ${{ vars.VEX_WINDOWS_UPDATE_KEY_ID }}
          VEX_WINDOWS_SERVICE_PROFILE_KEYRING_PATH: native-windows/packaging/profile-signing-keys.json
          VEX_WINDOWS_SIGN_TIMESTAMP_URI: ${{ vars.VEX_WINDOWS_SIGN_TIMESTAMP_URI }}
          VEX_WINDOWS_SIGN_PFX_BASE64: ${{ secrets.VEX_WINDOWS_SIGN_PFX_BASE64 }}
          VEX_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.VEX_WINDOWS_SIGN_PFX_PASSWORD }}
          VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.VEX_WINDOWS_UPDATE_PUBLIC_KEY_BASE64 }}
          VEX_WINDOWS_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.VEX_WINDOWS_UPDATE_PRIVATE_KEY_BASE64 }}
          VEX_WINDOWS_UPDATE_ORIGIN: ${{ vars.VEX_WINDOWS_UPDATE_ORIGIN }}
          VEX_WINDOWS_UPDATE_REQUIRED: ${{ inputs.required_update }}
          VEX_WINDOWS_ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
        run: |
          . ./native-windows/packaging/ReleaseValidation.ps1
          ./native-windows/packaging/package-native-windows.ps1 -Architecture x64
          ./native-windows/packaging/package-native-windows.ps1 -Architecture arm64
          ./native-windows/packaging/publish-native-windows.ps1
          # A separate synthetic preceding version exercises package relocation
          # and rollback without publishing an invented historical release.
          $candidateVersion = ConvertTo-WindowsPackageVersion $env:VEX_WINDOWS_RELEASE_VERSION
          $parts = @($candidateVersion.Split('.') | ForEach-Object { [int]$_ })
          $changed = $false
          for ($index = 3; $index -ge 0; $index--) {
            if ($parts[$index] -gt 0) {
              $parts[$index]--
              for ($tail = $index + 1; $tail -lt 4; $tail++) { $parts[$tail] = 0 }
              $changed = $true
              break
            }
          }
          if (-not $changed) { throw 'Release version must permit a preceding version for install acceptance.' }
          $precedingVersion = $parts -join '.'
          $precedingRoot = Join-Path $env:RUNNER_TEMP 'vex-synthetic-preceding-release'
          ./native-windows/packaging/package-native-windows.ps1 -Architecture x64 -Version $precedingVersion -OutputRoot $precedingRoot
          ./native-windows/scripts/invoke-signed-install-acceptance.ps1 -DisposableRunner -PrecedingIsSynthetic `
            -CandidateBundleDirectory (Join-Path $PWD "native-windows/packaging/out/stable/x64/$candidateVersion") `
            -PrecedingBundleDirectory (Join-Path $precedingRoot "stable/x64/$precedingVersion") `
            -ResultPath (Join-Path $PWD 'native-windows/packaging/out/signed-install-acceptance-x64.json')
      - name: Retain sanitized signed-install phase evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vex-native-windows-signed-install-evidence-x64
          path: native-windows/packaging/out/signed-install-acceptance-x64.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain signed release artifacts for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vex-native-windows-packaged-release
          path: |
            native-windows/packaging/out/**
            native-windows/packaging/published/**
          if-no-files-found: error
          retention-days: 7
