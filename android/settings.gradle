pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

def vexBuildProfile = System.getenv('VEX_BUILD_PROFILE') ?: ''
def expoDevOnlyPackages = [
  'expo-dev-client',
  'expo-dev-launcher',
  'expo-dev-menu',
  'expo-dev-menu-interface',
]
if (vexBuildProfile && vexBuildProfile != 'development') {
  expoAutolinking.exclude = expoDevOnlyPackages
}

dependencyResolutionManagement {
  versionCatalogs {
    create("libs") {
      from(files("gradle/amnezia.libs.versions.toml"))
    }
  }
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    // Expo's config command requires an explicit target. Without it, a macOS
    // build produces an iOS-only graph and leaves Android native modules off
    // :app's classpath. Persist the Android graph in Gradle's expected file
    // and link from it directly so a stale host-platform cache cannot win.
    def autolinkingOutput = providers.exec {
      workingDir(rootDir.getParentFile())
      commandLine(expoAutolinking.rnConfigCommand + ["--platform", "android"])
    }.standardOutput.asText.get()
    def autolinkingConfig = file(".gradle/vex-autolinking.android.json")
    autolinkingConfig.parentFile.mkdirs()
    autolinkingConfig.text = autolinkingOutput
    ex.autolinkLibrariesFromConfigFile(autolinkingConfig)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'vex'

expoAutolinking.useExpoVersionCatalog()

include ':app'
def configuredAmneziaTunnelDir = providers.environmentVariable("AMNEZIAWG_TUNNEL_DIR").orNull
def amneziaTunnelDir = configuredAmneziaTunnelDir ? new File(configuredAmneziaTunnelDir) : new File(rootDir, "../external/amnezia/amneziawg-android/tunnel")
if (amneziaTunnelDir.isDirectory()) {
  include ':amneziawg-tunnel'
  project(':amneziawg-tunnel').projectDir = amneziaTunnelDir
}
includeBuild(expoAutolinking.reactNativeGradlePlugin)
